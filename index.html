<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Պարզ Եռանկյունաձև Փողոցներով Մեքենա</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background: #111;
    color: #fff;
    font-family: sans-serif;
    overflow: hidden;
    touch-action: none;
  }
  #gameContainer {
    position: relative;
    width: 100vw;
    height: 100vh;
  }
  canvas {
    display: block;
    background: #222;
  }
  /* UI և Կառավարման կոճակներ */
  #hud {
    position: absolute;
    top: 15px;
    left: 15px;
    background: rgba(0, 0, 0, 0.7);
    padding: 10px 15px;
    border-radius: 8px;
    font-size: 14px;
    border: 1px solid #444;
  }
  #minimap {
    position: absolute;
    top: 15px;
    right: 15px;
    width: 150px;
    height: 150px;
    background: rgba(0, 0, 0, 0.8);
    border: 2px solid #555;
    border-radius: 10px;
  }
  #controls {
    position: absolute;
    bottom: 25px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-around;
    padding: 0 20px;
  }
  .btn {
    width: 75px;
    height: 75px;
    border-radius: 50%;
    border: none;
    background: #333;
    color: white;
    font-size: 18px;
    font-weight: bold;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    cursor: pointer;
    user-select: none;
  }
  .btn:active { background: #555; transform: scale(0.95); }
  #msg {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(255, 0, 0, 0.8);
    color: white;
    padding: 10px 20px;
    border-radius: 5px;
    font-size: 18px;
    font-weight: bold;
    display: none;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="gameContainer">
  <canvas id="simCanvas"></canvas>
  <canvas id="minimap"></canvas>
  
  <div id="hud">
    Արագություն: <span id="speedVal">0</span> կմ/ժ<br>
    Կարգավիճակ: <span id="statusVal" style="color: #0ff;">Ընթացքի մեջ</span>
  </div>

  <div id="msg">💥 Բախում եզրին!</div>

  <div id="controls">
    <button class="btn" id="leftBtn">ՁԱԽ</button>
    <button class="btn" id="gasBtn">ԳԱԶ</button>
    <button class="btn" id="brakeBtn">ԱՐԳ.</button>
    <button class="btn" id="rightBtn">ԱՋ</button>
  </div>
</div>

<script>
const canvas = document.getElementById('simCanvas');
const ctx = canvas.getContext('2d');
const miniCanvas = document.getElementById('minimap');
const miniCtx = miniCanvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  miniCanvas.width = 150;
  miniCanvas.height = 150;
}
window.addEventListener('resize', resize);
resize();

// Աշխարհի և մեքենայի պարամետրեր
const world = {
  x: 400,
  y: 300,
  angle: 0,
  speed: 0,
  maxSpeed: 5,
  acceleration: 0.1,
  friction: 0.05,
  steeringSpeed: 0.04
};

// Ստեղծում ենք եռանկյունաձև փողոցների կետերը (հանգույցներ)
const triangleRoads = [
  { p1: {x: 400, y: 100}, p2: {x: 200, y: 500} }, // Ձախ կողմի փողոց
  { p1: {x: 200, y: 500}, p2: {x: 600, y: 500} }, // Հիմքի փողոց (ներքևի)
  { p1: {x: 600, y: 500}, p2: {x: 400, y: 100} }  // Աջ կողմի փողոց
];
const roadWidth = 70; // Փողոցի լայնությունը

// Ստեղնաշարի և կոճակների վիճակ
const keys = { left: false, right: false, gas: false, brake: false };

function setupButton(id, keyName) {
  const el = document.getElementById(id);
  el.addEventListener('pointerdown', (e) => { keys[keyName] = true; e.preventDefault(); });
  el.addEventListener('pointerup', (e) => { keys[keyName] = false; e.preventDefault(); });
  el.addEventListener('pointerleave', (e) => { keys[keyName] = false; e.preventDefault(); });
}
setupButton('leftBtn', 'left');
setupButton('rightBtn', 'right');
setupButton('gasBtn', 'gas');
setupButton('brakeBtn', 'brake');

// Հեռավորությունը կետից հատվածին (եզրերի ստուգման համար)
function distToSegmentSquared(p, v, w) {
  const l2 = (w.x - v.x) * (w.x - v.x) + (w.y - v.y) * (w.y - v.y);
  if (l2 === 0) return (p.x - v.x) * (p.x - v.x) + (p.y - v.y) * (p.y - v.y);
  let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
  t = Math.max(0, Math.min(1, t));
  return (p.x - (v.x + t * (w.x - v.x))) * (p.x - (v.x + t * (w.x - v.x))) +
         (p.y - (v.y + t * (w.y - v.y))) * (p.y - (v.y + t * (w.y - v.y)));
}

// Ստուգել արդյոք մեքենան գտնվում է եռանկյունաձև փողոցների սահմաններում
function checkRoadBounds(x, y) {
  let minDistance = Infinity;
  for (let r of triangleRoads) {
    let d = Math.sqrt(distToSegmentSquared({x, y}, r.p1, r.p2));
    if (d < minDistance) minDistance = d;
  }
  // Եթե հեռավորությունը մեծ է փողոցի կեսից, նշանակում է մոտեցել է եզրին
  return minDistance <= (roadWidth / 2 - 10);
}

let collisionWarningTimer = 0;

function update() {
  //Ղեկավարում
  if (keys.left) world.angle -= world.steeringSpeed * (world.speed / world.maxSpeed || 0.5);
  if (keys.right) world.angle += world.steeringSpeed * (world.speed / world.maxSpeed || 0.5);
  
  if (keys.gas) world.speed = Math.min(world.maxSpeed, world.speed + world.acceleration);
  else if (keys.brake) world.speed = Math.max(0, world.speed - world.acceleration * 2);
  else {
    if (world.speed > 0) world.speed = Math.max(0, world.speed - world.friction);
  }

  // Հաշվարկում ենք հաջորդ կետը
  let nextX = world.x + Math.sin(world.angle) * world.speed;
  let nextY = world.y - Math.cos(world.angle) * world.speed;

  // Ստուգում ենք՝ արդյոք դուրս է գալիս փողոցից
  if (checkRoadBounds(nextX, nextY)) {
    world.x = nextX;
    world.y = nextY;
    document.getElementById('msg').style.display = 'none';
  } else {
    // Բախում եզրին, արգելափակել շարժը
    world.speed = -world.speed * 0.3; // Հակադարձ թեթև հետհարված
    collisionWarningTimer = 30;
    document.getElementById('msg').style.display = 'block';
  }

  if (collisionWarningTimer > 0) {
    collisionWarningTimer--;
    if (collisionWarningTimer === 0) {
      document.getElementById('msg').style.display = 'none';
    }
  }

  // UI թարմացում
  document.getElementById('speedVal').textContent = Math.round(Math.abs(world.speed * 15));
}

function draw() {
  // Մաքրել հիմնական կտավը
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  // Կենտրոնացնել տեսախցիկը մեքենայի վրա
  ctx.translate(canvas.width / 2, canvas.height / 2);
  ctx.rotate(-world.angle);
  ctx.translate(-world.x, -world.y);

  // 1. Նկարել փողոցները (եռանկյուն)
  ctx.lineWidth = roadWidth;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#333';
  ctx.beginPath();
  ctx.moveTo(triangleRoads[0].p1.x, triangleRoads[0].p1.y);
  ctx.lineTo(triangleRoads[0].p2.x, triangleRoads[0].p2.y);
  ctx.lineTo(triangleRoads[1].p2.x, triangleRoads[1].p2.y);
  ctx.closePath();
  ctx.stroke();

  // Փողոցների սպիտակ եզրագծեր
  ctx.lineWidth = 3;
  ctx.strokeStyle = '#666';
  ctx.stroke();

  // 2. Նկարել մեքենան
  ctx.save();
  ctx.translate(world.x, world.y);
  ctx.rotate(world.angle);
  ctx.fillStyle = '#ff3333';
  ctx.fillRect(-15, -25, 30, 50); // Մարմին
  ctx.fillStyle = '#111';
  ctx.fillRect(-12, -20, 24, 12); // Առջևի ապակի
  ctx.restore();

  ctx.restore();

  // 3. Նկարել Մինի-քարտեզը (Minimap)
  miniCtx.clearRect(0, 0, miniCanvas.width, miniCanvas.height);
  miniCtx.fillStyle = '#111';
  miniCtx.fillRect(0, 0, miniCanvas.width, miniCanvas.height);

  // Փողոցները մինի-քարտեզի վրա (մասշտաբավորված)
  miniCtx.strokeStyle = '#555';
  miniCtx.lineWidth = 8;
  miniCtx.beginPath();
  miniCtx.moveTo(triangleRoads[0].p1.x / 5, triangleRoads[0].p1.y / 5);
  miniCtx.lineTo(triangleRoads[0].p2.x / 5, triangleRoads[0].p2.y / 5);
  miniCtx.lineTo(triangleRoads[1].p2.x / 5, triangleRoads[1].p2.y / 5);
  miniCtx.closePath();
  miniCtx.stroke();

  // Մեքենայի դիրքը մինի-քարտեզի վրա
  miniCtx.fillStyle = '#0ff';
  miniCtx.beginPath();
  miniCtx.arc(world.x / 5, world.y / 5, 4, 0, Math.PI * 2);
  miniCtx.fill();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>

</body>
</html>
