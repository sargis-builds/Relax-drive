<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>3D Փողոցային Մեքենա</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background: #000;
    color: #fff;
    font-family: sans-serif;
    overflow: hidden;
    touch-action: none;
  }
  #gameContainer {
    position: relative;
    width: 100vw;
    height: 100vh;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  #hud {
    position: absolute;
    top: 15px;
    left: 15px;
    background: rgba(0, 0, 0, 0.7);
    padding: 10px 15px;
    border-radius: 8px;
    font-size: 14px;
    border: 1px solid #444;
    z-index: 10;
  }
  #minimap {
    position: absolute;
    top: 15px;
    right: 15px;
    width: 140px;
    height: 140px;
    background: rgba(0, 0, 0, 0.8);
    border: 2px solid #555;
    border-radius: 10px;
    z-index: 10;
  }
  #controls {
    position: absolute;
    bottom: 25px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-around;
    padding: 0 20px;
    z-index: 10;
  }
  .btn {
    width: 75px;
    height: 75px;
    border-radius: 50%;
    border: none;
    background: #333;
    color: white;
    font-size: 18px;
    font-weight: bold;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    cursor: pointer;
    user-select: none;
  }
  .btn:active { background: #555; transform: scale(0.95); }
  #msg {
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(255, 0, 0, 0.85);
    color: white;
    padding: 10px 20px;
    border-radius: 6px;
    font-size: 16px;
    font-weight: bold;
    display: none;
    z-index: 20;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="gameContainer">
  <canvas id="gameCanvas"></canvas>
  <canvas id="minimap"></canvas>
  
  <div id="hud">
    Արագություն: <span id="speedVal">0</span> կմ/ժ<br>
    Փողոց: <span id="streetName" style="color: #ff9933;">Կենտրոնական պողոտա</span>
  </div>

  <div id="msg">💥 Բախում եզրին! Դուրս գալ չի կարելի</div>

  <div id="controls">
    <button class="btn" id="leftBtn">ՁԱԽ</button>
    <button class="btn" id="gasBtn">ԳԱԶ</button>
    <button class="btn" id="brakeBtn">ԱՐԳ.</button>
    <button class="btn" id="rightBtn">ԱՋ</button>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const miniCanvas = document.getElementById('minimap');
const miniCtx = miniCanvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Մեքենայի և աշխարհի պարամետրեր
const player = {
  x: 0,
  y: 0,
  angle: 0, // Ուղղությունը (ռադիաններով)
  speed: 0,
  maxSpeed: 4,
  accel: 0.08,
  friction: 0.04,
  turnSpeed: 0.04
};

// Քարտեզի փողոցներ (Ուղղանկյուն ցանց՝ խաչմերուկներով)
// Յուրաքանչյուր փողոց ունի սկզբնակետ (x1, y1) և վերջնակետ (x2, y2) ու լայնություն
const roads = [
  { x1: -300, y1: 0, x2: 300, y2: 0, width: 80, name: "Գլխավոր Պողոտա" },
  { x1: 0, y1: -300, x2: 0, y2: 300, width: 80, name: "Խաչմերուկի փողոց" },
  { x1: -300, y1: -200, x2: 300, y2: -200, width: 70, name: "Հյուսիսային փողոց" },
  { x1: -200, y1: -200, x2: -200, y2: 200, width: 70, name: "Արևմտյան փողոց" }
];

// Ստեղնաշար / Կոճակներ
const keys = { left: false, right: false, gas: false, brake: false };

function setupButton(id, keyName) {
  const el = document.getElementById(id);
  if(!el) return;
  el.addEventListener('pointerdown', (e) => { keys[keyName] = true; e.preventDefault(); });
  el.addEventListener('pointerup', (e) => { keys[keyName] = false; e.preventDefault(); });
  el.addEventListener('pointerleave', (e) => { keys[keyName] = false; e.preventDefault(); });
}
setupButton('leftBtn', 'left');
setupButton('rightBtn', 'right');
setupButton('gasBtn', 'gas');
setupButton('brakeBtn', 'brake');

// Հեռավորությունը կետից հատվածին (սահմանների ստուգման համար)
function getDistToSegment(px, py, x1, y1, x2, y2) {
  const l2 = (x2 - x1) * (x2 - x1) + (y2 - y1) * (y2 - y1);
  if (l2 === 0) return Math.hypot(px - x1, py - y1);
  let t = ((px - x1) * (x2 - x1) + (py - y1) * (y2 - y1)) / l2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (x1 + t * (x2 - x1)), py - (y1 + t * (y2 - y1)));
}

// Ստուգել արդյոք մեքենան գտնվում է որևէ փողոցի սահմաններում
function isInsideAnyRoad(x, y) {
  for (let r of roads) {
    let dist = getDistToSegment(x, y, r.x1, r.y1, r.x2, r.y2);
    // Եթե մեքենան տեղավորվում է փողոցի լայնության կեսի մեջ
    if (dist <= r.width / 2 - 10) {
      return true;
    }
  }
  return false;
}

let warningTimer = 0;

function update() {
  // Ղեկավարում (Աջ / Ձախ)
  if (keys.left) player.angle -= player.turnSpeed * (player.speed / player.maxSpeed || 0.5);
  if (keys.right) player.angle += player.turnSpeed * (player.speed / player.maxSpeed || 0.5);

  // Արագացում / Արգելակում
  if (keys.gas) player.speed = Math.min(player.maxSpeed, player.speed + player.accel);
  else if (keys.brake) player.speed = Math.max(0, player.speed - player.accel * 2);
  else {
    if (player.speed > 0) player.speed = Math.max(0, player.speed - player.friction);
  }

  // Հաջորդ հնարավոր կոորդինատը
  let nextX = player.x + Math.sin(player.angle) * player.speed;
  let nextY = player.y - Math.cos(player.angle) * player.speed;

  // Ստուգում ենք՝ արդյոք չի դուրս գալիս փողոցից
  if (isInsideAnyRoad(nextX, nextY)) {
    player.x = nextX;
    player.y = nextY;
    document.getElementById('msg').style.display = 'none';
  } else {
    // Բախում եզրին, հետ հարված և կանգնեցում
    player.speed = -player.speed * 0.2;
    warningTimer = 40;
    document.getElementById('msg').style.display = 'block';
  }

  if (warningTimer > 0) {
    warningTimer--;
    if (warningTimer === 0) document.getElementById('msg').style.display = 'none';
  }

  document.getElementById('speedVal').textContent = Math.round(player.speed * 20);
}

// 3Դ Տեսքի Նկարում (Հեռանկարային պրոյեկցիա՝ ձեր նկարի նման)
function draw3DView() {
  const W = canvas.width;
  const H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  // Երկինք և գետին
  ctx.fillStyle = '#0a0d14';
  ctx.fillRect(0, 0, W, H * 0.5);
  ctx.fillStyle = '#1c222b';
  ctx.fillRect(0, H * 0.5, W, H * 0.5);

  // Հորիզոնի գիծ
  const horizonY = H * 0.5;

  // Փողոցի հեռանկարային նկարում
  ctx.fillStyle = '#2d333b';
  ctx.beginPath();
  ctx.moveTo(W / 2 - 40, horizonY);
  ctx.lineTo(W / 2 - W * 0.45, H);
  ctx.lineTo(W / 2 + W * 0.45, H);
  ctx.lineTo(W / 2 + 40, horizonY);
  ctx.closePath();
  ctx.fill();

  // Փողոցի մեջտեղի գծեր (որոնք գնում են առաջ՝ ձեր նկարի նման)
  ctx.strokeStyle = '#f0a500';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(W / 2, horizonY);
  ctx.lineTo(W / 2, H);
  ctx.stroke();

  // Շենքեր կողքերից (3Դ հեռանկար)
  for (let i = 0; i < 5; i++) {
    let depthOffset = (i * 80 - (Date.now() * player.speed * 0.5) % 80);
    let scale = 1 / (i * 0.4 + 0.5);
    
    // Ձախ շենքեր
    ctx.fillStyle = '#4a5568';
    ctx.fillRect(W / 2 - 250 * scale, horizonY - 100 * scale, 120 * scale, 200 * scale);
    // Աջ շենքեր
    ctx.fillRect(W / 2 + 130 * scale, horizonY - 100 * scale, 120 * scale, 200 * scale);
  }

  // Մեքենան (միշտ մեջտեղում՝ ձեր նկարածի պես)
  drawCar(W / 2, H * 0.75);
}

function drawCar(x, y) {
  ctx.save();
  ctx.translate(x, y);
  
  // Մեքենայի մարմին (Կարմիր)
  ctx.fillStyle = '#e53e3e';
  ctx.beginPath();
  ctx.roundRect(-40, -25, 80, 50, 10);
  ctx.fill();

  // Ապակի
  ctx.fillStyle = '#1a202c';
  ctx.fillRect(-25, -15, 50, 25);

  // Անվադողեր
  ctx.fillStyle = '#000';
  ctx.fillRect(-45, -22, 10, 15);
  ctx.fillRect(35, -22, 10, 15);
  ctx.fillRect(-45, 7, 10, 15);
  ctx.fillRect(35, 7, 10, 15);

  ctx.restore();
}

// Մինի-քարտեզ
function drawMinimap() {
  const mw = miniCanvas.width;
  const mh = miniCanvas.height;
  miniCtx.clearRect(0, 0, mw, mh);
  miniCtx.fillStyle = '#111';
  miniCtx.fillRect(0, 0, mw, mh);

  // Փողոցները մինի-քարտեզի վրա
  miniCtx.strokeStyle = '#4a5568';
  miniCtx.lineWidth = 6;
  for (let r of roads) {
    let x1 = mw / 2 + r.x1 * 0.3;
    let y1 = mh / 2 + r.y1 * 0.3;
    let x2 = mw / 2 + r.x2 * 0.3;
    let y2 = mh / 2 + r.y2 * 0.3;
    miniCtx.beginPath();
    miniCtx.moveTo(x1, y1);
    miniCtx.lineTo(x2, y2);
    miniCtx.stroke();
  }

  // Մեքենան քարտեզի վրա
  let px = mw / 2 + player.x * 0.3;
  let py = mh / 2 + player.y * 0.3;
  miniCtx.fillStyle = '#00ffcc';
  miniCtx.beginPath();
  miniCtx.arc(px, py, 4, 0, Math.PI * 2);
  miniCtx.fill();
}

function loop() {
  update();
  draw3DView();
  drawMinimap();
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>

</body>
</html>
