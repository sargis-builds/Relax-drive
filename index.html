<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#04060d">
<title>ԳԻՇԵՐԱՅԻՆ ԵՐԹԵՎԵԿՈՒԹՅՈՒՆ</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;
  user-select:none;-webkit-user-select:none;
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
html,body{width:100%;height:100%;overflow:hidden;background:#04060d;color:#fff;
  touch-action:none;overscroll-behavior:none;position:fixed}

#app{position:fixed;inset:0;overflow:hidden;background:#04060d}

/* ՊՈՐՏՐԵՏ → ՀՈՐԻԶՈՆԱԿԱՆ ՖՈԼԲԵՔ */
@media (orientation:portrait){
  #app{
    width:100vh;height:100vw;
    top:50%;left:50%;
    transform:translate(-50%,-50%) rotate(90deg);
    transform-origin:center center;
  }
}

canvas{display:block;position:absolute;inset:0;width:100%;height:100%}

/* =================== ԷՖԵԿՏՆԵՐ =================== */
#vig{position:absolute;inset:0;pointer-events:none;z-index:5;
  background:radial-gradient(ellipse at center,rgba(0,0,0,0) 42%,rgba(0,0,0,.62) 100%)}
#speedFx{position:absolute;inset:0;pointer-events:none;z-index:6;opacity:0;
  transition:opacity .18s linear;
  background:radial-gradient(ellipse at 50% 55%,rgba(80,140,255,0) 30%,rgba(100,150,255,.14) 65%,rgba(180,120,255,.26) 100%)}
#flash{position:absolute;inset:0;pointer-events:none;z-index:7;opacity:0;
  background:radial-gradient(ellipse at center,rgba(255,0,0,0) 25%,rgba(255,30,30,.82) 100%);
  transition:opacity .3s}

/* =================== HUD =================== */
#hud{position:absolute;inset:0;pointer-events:none;z-index:10}

.panel{
  background:linear-gradient(165deg,rgba(16,22,42,.86),rgba(8,12,24,.78));
  border:1px solid rgba(120,180,255,.22);
  border-radius:16px;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:0 8px 30px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.09)}

#topLeft{position:absolute;top:12px;left:12px;padding:10px 18px;
  display:flex;flex-direction:column;gap:3px}
#lvlName{font-size:11px;letter-spacing:2px;color:#7fd4ff;font-weight:700}
#distVal{font-size:22px;font-weight:800;letter-spacing:.5px;
  background:linear-gradient(90deg,#fff,#9ad8ff);-webkit-background-clip:text;background-clip:text;color:transparent}

#topRight{position:absolute;top:12px;right:12px;padding:10px 18px;
  text-align:right;min-width:158px}
#spdVal{font-size:38px;font-weight:900;line-height:1;letter-spacing:-1.5px;
  background:linear-gradient(90deg,#7ee7ff,#5eb0ff);-webkit-background-clip:text;background-clip:text;color:transparent;
  transition:filter .2s}
#spdUnit{font-size:11px;color:#8ea3c8;letter-spacing:3px;font-weight:700;margin-top:2px}
#hpWrap{margin-top:9px;width:100%;height:8px;border-radius:5px;
  background:rgba(255,255,255,.12);overflow:hidden;position:relative}
#hpBar{height:100%;width:100%;border-radius:5px;
  background:linear-gradient(90deg,#3ddc84,#a8ff60);transition:width .22s,background .3s;
  box-shadow:0 0 12px rgba(80,255,140,.5)}

/* ՄԻՆԻ ՔԱՐՏԵԶ */
#mapWrap{position:absolute;top:12px;right:12px;width:0;height:0;overflow:hidden}
#mapPanel{position:absolute;top:96px;right:12px;width:160px;height:160px;
  border-radius:18px;overflow:hidden;
  background:linear-gradient(165deg,rgba(14,20,40,.88),rgba(6,10,22,.85));
  border:1px solid rgba(120,180,255,.28);
  box-shadow:0 8px 26px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.08);
  backdrop-filter:blur(10px)}
#mapCanvas{width:100%;height:100%;display:block}

/* ՀՐԱՀԱՆԳԻ ՍԼԱՔ (objective arrow) */
#objArrow{
  position:absolute;top:74px;left:50%;transform:translateX(-50%);
  pointer-events:none;opacity:.92;
  transition:opacity .3s}
#objArrow svg{filter:drop-shadow(0 4px 12px rgba(255,190,80,.8))}
#objLabel{
  position:absolute;top:120px;left:50%;transform:translateX(-50%);
  font-size:11px;font-weight:800;letter-spacing:2px;
  color:#ffd45e;text-shadow:0 2px 10px rgba(0,0,0,.9);
  white-space:nowrap;pointer-events:none}

/* =================== ԿՈՃԱԿՆԵՐ =================== */
#controls{position:absolute;inset:0;z-index:20;pointer-events:none}

.btn{
  position:absolute;pointer-events:auto;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;
  background:linear-gradient(160deg,rgba(30,42,74,.94),rgba(12,18,36,.94));
  border:2.5px solid rgba(130,190,255,.4);
  box-shadow:0 10px 26px rgba(0,0,0,.6),inset 0 2px 0 rgba(255,255,255,.14);
  color:#cfe4ff;font-weight:900;
  transition:transform .08s,background .12s,border-color .12s,box-shadow .12s;
  touch-action:none;
  -webkit-user-select:none;user-select:none}
.btn:active,.btn.on{transform:scale(.93);
  background:linear-gradient(160deg,rgba(80,140,255,.96),rgba(40,80,200,.96));
  border-color:rgba(180,220,255,.95);color:#fff;
  box-shadow:0 6px 18px rgba(80,140,255,.5),inset 0 2px 0 rgba(255,255,255,.3)}

/* ՂԵԿԻ ԿՈՃԱԿՆԵՐ - ՄԵԾ, ՀԱՐՄԱՐ */
#btnL{left:24px;bottom:26px;width:112px;height:112px;font-size:44px}
#btnR{left:154px;bottom:26px;width:112px;height:112px;font-size:44px}

/* ՊԵԴԱԼՆԵՐ */
#btnBrake{right:158px;bottom:30px;width:96px;height:96px;
  font-size:12px;letter-spacing:1.5px;
  border-color:rgba(255,120,120,.55);color:#ffb4b4}
#btnBrake:active,#btnBrake.on{
  background:linear-gradient(160deg,rgba(255,70,70,.96),rgba(180,20,20,.96));
  border-color:#ff9a9a;box-shadow:0 6px 18px rgba(255,60,60,.5)}

#btnGas{right:28px;bottom:22px;width:124px;height:124px;
  font-size:16px;letter-spacing:2px;
  border-color:rgba(120,255,170,.55);color:#b6ffd4}
#btnGas:active,#btnGas.on{
  background:linear-gradient(160deg,rgba(50,230,130,.96),rgba(10,150,70,.96));
  border-color:#a8ffcf;box-shadow:0 6px 18px rgba(60,230,130,.55)}

/* ՂԵԿԻ ՑՈՒՑԻՉ */
#wheelBox{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);
  width:120px;height:120px;pointer-events:none;z-index:19;
  filter:drop-shadow(0 8px 20px rgba(0,0,0,.7))}
#wheelInner{width:100%;height:100%;position:relative;
  transition:transform .045s linear}
.wRim{position:absolute;inset:0;border-radius:50%;
  border:11px solid transparent;
  background:linear-gradient(#0d1424,#0d1424) padding-box,
    conic-gradient(from 200deg,#2a3a5c,#48597f,#8fa8d8,#48597f,#2a3a5c,#1a2438,#48597f,#8fa8d8,#48597f,#2a3a5c) border-box;
  box-shadow:inset 0 0 16px rgba(0,0,0,.85),0 0 0 1px rgba(150,200,255,.2)}
.wSpoke{position:absolute;left:50%;top:50%;width:13px;height:52px;
  margin-left:-6.5px;border-radius:4px;
  background:linear-gradient(180deg,#5f74a0,#2a3550);
  box-shadow:0 0 8px rgba(0,0,0,.6);transform-origin:50% 0}
.ws1{transform:rotate(180deg)}
.ws2{transform:rotate(60deg)}
.ws3{transform:rotate(-60deg)}
.wHub{position:absolute;left:50%;top:50%;width:36px;height:36px;
  margin:-18px 0 0 -18px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#7a8fc0,#1b2438 70%);
  box-shadow:0 0 0 3px #0b1120,0 0 12px rgba(120,180,255,.4),inset 0 2px 3px rgba(255,255,255,.28)}
.wMark{position:absolute;left:50%;top:4px;width:5px;height:16px;
  margin-left:-2.5px;border-radius:3px;
  background:linear-gradient(180deg,#ff5b5b,#a01010);
  box-shadow:0 0 8px rgba(255,60,60,.9)}

/* ԿԱՄԵՐԱՅԻ ԿԱՌԱՎԱՐՄԱՆ ԳՈՏԻ */
#camZone{position:absolute;top:0;right:0;width:90px;height:100%;
  pointer-events:auto;z-index:21;touch-action:none}
#camHint{position:absolute;right:14px;top:50%;transform:translateY(-50%);
  writing-mode:vertical-rl;font-size:9px;letter-spacing:3px;
  color:rgba(120,180,255,.35);font-weight:700;
  pointer-events:none;user-select:none;
  transition:opacity .4s}

/* =================== ՀԱՂՈՐԴԱԳՐՈՒԹՅՈՒՆ =================== */
#msg{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);
  font-size:72px;font-weight:900;letter-spacing:6px;text-align:center;
  text-shadow:0 0 40px rgba(120,190,255,.9),0 6px 30px rgba(0,0,0,.85);
  pointer-events:none;opacity:0;z-index:30;white-space:nowrap}
#msg.show{animation:popMsg .9s ease-out}
@keyframes popMsg{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}
  22%{opacity:1;transform:translate(-50%,-50%) scale(1.14)}
  72%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.4)}}
#msg.red{color:#ff5a5a;text-shadow:0 0 46px rgba(255,60,60,.95),0 6px 30px rgba(0,0,0,.85)}
#msg.gold{color:#ffd45e;text-shadow:0 0 46px rgba(255,200,60,.95),0 6px 30px rgba(0,0,0,.85)}
#msg.green{color:#8affc0;text-shadow:0 0 46px rgba(80,255,140,.9),0 6px 30px rgba(0,0,0,.85)}

/* =================== ՄԵՆՅՈՒ / ԷԿՐԱՆՆԵՐ =================== */
.screen{position:absolute;inset:0;z-index:50;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:
    radial-gradient(ellipse at 50% 0%,rgba(80,60,180,.42),transparent 62%),
    radial-gradient(ellipse at 50% 100%,rgba(255,110,60,.22),transparent 62%),
    linear-gradient(170deg,#070b18,#0d1226 45%,#160f22);
  backdrop-filter:blur(6px);transition:opacity .4s}
.screen.hide{opacity:0;pointer-events:none}

#title{font-size:clamp(36px,7.2vw,68px);font-weight:900;letter-spacing:11px;
  background:linear-gradient(90deg,#6ee7ff,#a78bfa,#ff8a5b,#ffd45e,#6ee7ff);
  background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shine 6s linear infinite;
  filter:drop-shadow(0 0 30px rgba(120,180,255,.6))}
@keyframes shine{to{background-position:300% 0}}
#sub{font-size:12px;letter-spacing:8px;color:#7f93b8;margin-top:-6px;font-weight:700}

#levels{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;
  max-width:94vw;margin-top:8px}
.lvlBtn{width:80px;height:80px;border-radius:20px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  background:linear-gradient(160deg,rgba(35,48,82,.96),rgba(14,20,38,.96));
  border:2px solid rgba(120,180,255,.34);
  box-shadow:0 8px 22px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.12);
  transition:transform .13s,border-color .2s,box-shadow .2s}
.lvlBtn:active{transform:scale(.93)}
.lvlBtn .n{font-size:26px;font-weight:900;color:#dceaff}
.lvlBtn .t{font-size:8px;letter-spacing:1.5px;color:#7f93b8;font-weight:700}
.lvlBtn.locked{opacity:.32;filter:grayscale(1);cursor:not-allowed}
.lvlBtn.done{border-color:rgba(80,255,160,.7);
  box-shadow:0 0 22px rgba(60,230,140,.4),0 8px 22px rgba(0,0,0,.55)}
.lvlBtn.done .n{color:#8affc0}

#startBtn{margin-top:6px;padding:16px 66px;border-radius:52px;cursor:pointer;
  font-size:20px;font-weight:900;letter-spacing:5px;color:#04121e;
  background:linear-gradient(90deg,#5eead4,#60a5fa,#a78bfa);
  background-size:220% 100%;
  border:none;box-shadow:0 12px 36px rgba(90,150,255,.55),inset 0 0 0 1px rgba(255,255,255,.22);
  animation:shine 3.8s linear infinite;transition:transform .13s}
#startBtn:active{transform:scale(.95)}

#hint{font-size:11px;color:#61748f;letter-spacing:2px;text-align:center;
  line-height:1.9;margin-top:4px;max-width:88vw}
.k{display:inline-block;padding:2px 9px;border-radius:7px;
  background:rgba(120,180,255,.16);border:1px solid rgba(120,180,255,.32);
  color:#a8ccff;font-weight:700;margin:0 2px}

#pauseBtn{position:absolute;top:12px;left:50%;transform:translateX(-50%);
  pointer-events:auto;padding:8px 20px;border-radius:13px;
  font-size:11px;letter-spacing:2px;font-weight:800;color:#9fc6ff;cursor:pointer;
  background:rgba(10,16,32,.75);border:1px solid rgba(120,180,255,.3);
  backdrop-filter:blur(8px);z-index:25;transition:background .2s}
#pauseBtn:active{background:rgba(30,50,90,.9)}

#endScreen{position:absolute;inset:0;z-index:60;display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:18px;
  background:radial-gradient(ellipse at center,rgba(10,16,32,.85),rgba(3,5,12,.97));
  backdrop-filter:blur(11px)}
#endScreen.show{display:flex}
#endTitle{font-size:clamp(32px,6.2vw,60px);font-weight:900;letter-spacing:9px}
#endSub{font-size:13px;letter-spacing:3px;color:#8ea3c8;text-align:center;padding:0 20px}
.endBtn{padding:14px 46px;border-radius:42px;cursor:pointer;
  font-size:15px;font-weight:900;letter-spacing:3px;
  border:2px solid rgba(130,190,255,.5);color:#cfe4ff;
  background:linear-gradient(160deg,rgba(40,60,110,.9),rgba(14,20,38,.9));
  transition:transform .12s}
.endBtn:active{transform:scale(.95)}
.endBtn.primary{background:linear-gradient(90deg,#5eead4,#60a5fa);color:#04121e;border:none;
  box-shadow:0 10px 30px rgba(90,150,255,.5)}

#rotHint{position:absolute;bottom:6px;width:100%;text-align:center;
  font-size:10px;color:#4a5a75;letter-spacing:2px;pointer-events:none}
</style>
</head>
<body>
<div id="app">
  <canvas id="scene"></canvas>
  <div id="vig"></div>
  <div id="speedFx"></div>
  <div id="flash"></div>

  <div id="hud">
    <div class="panel" id="topLeft">
      <div id="lvlName">ՄԱԿԱՐԴԱԿ 1</div>
      <div id="distVal">0 մ</div>
    </div>
    <div class="panel" id="topRight">
      <div id="spdVal">0</div>
      <div id="spdUnit">ԿՄ/Ժ</div>
      <div id="hpWrap"><div id="hpBar"></div></div>
    </div>

    <div id="mapPanel"><canvas id="mapCanvas" width="320" height="320"></canvas></div>

    <div id="objArrow">
      <svg width="44" height="44" viewBox="0 0 44 44">
        <path d="M22 4 L34 34 L22 27 L10 34 Z" fill="#ffd45e" stroke="#a67c1a" stroke-width="1.5" stroke-linejoin="round"/>
      </svg>
    </div>
    <div id="objLabel">ՆՊԱՏԱԿԸ՝ 0 մ</div>

    <div id="pauseBtn">⏸ ԿԱՆԳ</div>

    <div id="wheelBox">
      <div id="wheelInner">
        <div class="wRim"></div>
        <div class="wSpoke ws1"></div>
        <div class="wSpoke ws2"></div>
        <div class="wSpoke ws3"></div>
        <div class="wHub"></div>
        <div class="wMark"></div>
      </div>
    </div>
  </div>

  <div id="controls">
    <div class="btn" id="btnL">◀</div>
    <div class="btn" id="btnR">▶</div>
    <div class="btn" id="btnBrake">ԱՐԳԵԼ</div>
    <div class="btn" id="btnGas">ԳԱԶ</div>
  </div>

  <div id="camZone"></div>
  <div id="camHint">↕ ԿԱՄԵՐԱ</div>

  <div id="msg"></div>

  <div class="screen" id="menu">
    <div id="title">ԳԻՇԵՐԱՅԻՆ ԵՐԹԵՎԵԿՈՒԹՅՈՒՆ</div>
    <div id="sub">3D · ENDLESS · NIGHT CITY</div>
    <div id="levels"></div>
    <button id="startBtn">ՍԿՍԵԼ</button>
    <div id="hint">
      <span class="k">◀ ▶</span> ղեկ &nbsp;·&nbsp; <span class="k">ԳԱԶ</span> &nbsp;·&nbsp; <span class="k">ԱՐԳԵԼ</span> &nbsp;·&nbsp;
      <span class="k">Աջ եզր</span> քաշիր ↕ կամերա<br>
      Հասի՛ր կարմիր գոտուն և <b>կանգնի՛ր</b> · 150+ = վթար
    </div>
  </div>

  <div id="endScreen">
    <div id="endTitle">—</div>
    <div id="endSub">—</div>
    <div style="display:flex;gap:14px;flex-wrap:wrap;justify-content:center">
      <div class="endBtn primary" id="btnRetry">ԿՐԿՆԵԼ</div>
      <div class="endBtn" id="btnMenu">ՄԵՆՅՈՒ</div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════════
   ԳԻՇԵՐԱՅԻՆ ԵՐԹԵՎԵԿՈՒԹՅՈՒՆ 3D — ամբողջական խաղ
   ═══════════════════════════════════════════════════════════════════ */
(function(){
'use strict';

/* ─────────────────────────────────────────────
   1. ՀԱՍՏԱՏՈՒՆՆԵՐ
───────────────────────────────────────────── */
const ROAD_HALF = 9;
const SEG_LEN   = 6;
const NUM_SEG   = 220;
const LANE_OFF  = [-6.5, -2.2, 2.2, 6.5]; // -X = հանդիպակաց, +X = մեր ուղղությամբ (player-ը +2.2-ի վրա)
const MAX_SPEED = 180;

const LEVELS = [
  {len:2600, spawn:1.7, name:'ՔԱՂԱՔ'},
  {len:3100, spawn:1.5, name:'ՄԱՅՐՈՒՂԻ'},
  {len:3600, spawn:1.3, name:'ԽԱՉՄԵՐՈՒԿ'},
  {len:4100, spawn:1.1, name:'ԱՎՏՈԲԱՀՆ'},
  {len:4600, spawn:0.9, name:'ՄԵԾ ԽՃՈՒՄ'}
];

/* ─────────────────────────────────────────────
   2. ՎԻՃԱԿ
───────────────────────────────────────────── */
const S = {
  phase:'menu',
  level:1,
  speed:0,
  x:0, z:0, heading:0,
  steer:0, steerTarget:0,
  health:100,
  levelLen:2600,
  hitCd:0,
  shake:0,
  camX:0, camY:0, camZ:0,
  camLookX:0, camLookY:0, camLookZ:0,
  camPitch:0,          // ← աջ եզրից ձգելով՝ -0.4..+0.35
  camDist:10.5,
  camHeight:4.4,
  time:0,
  countdown:0,
  _lastC:undefined,
  best:JSON.parse(localStorage.getItem('gisher_best')||'{}')
};

const input = { gas:false, brake:false, left:false, right:false };

/* ─────────────────────────────────────────────
   3. ՁԱՅՆ — փափուկ շարժիչ + հանգիստ երաժշտություն
───────────────────────────────────────────── */
const Audio_ = {
  ctx:null, ready:false, master:null,
  engGain:null, engFilt:null,
  o1:null, o2:null, o3:null,
  musicGain:null, musicTimer:null, step:0,

  init(){
    if(this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.7;
    this.master.connect(this.ctx.destination);

    // ─── Շարժիչ. փափուկ sine + triangle, lowpass ───
    this.engGain = this.ctx.createGain();
    this.engGain.gain.value = 0;
    this.engFilt = this.ctx.createBiquadFilter();
    this.engFilt.type = 'lowpass';
    this.engFilt.frequency.value = 320;
    this.engFilt.Q.value = 1.6;
    this.engFilt.connect(this.engGain);
    this.engGain.connect(this.master);

    this.o1 = this.ctx.createOscillator();
    this.o1.type = 'sine';
    this.o1.frequency.value = 42;
    const g1 = this.ctx.createGain(); g1.gain.value = 1.0;
    this.o1.connect(g1); g1.connect(this.engFilt);
    this.o1.start();

    this.o2 = this.ctx.createOscillator();
    this.o2.type = 'triangle';
    this.o2.frequency.value = 63;
    const g2 = this.ctx.createGain(); g2.gain.value = 0.55;
    this.o2.connect(g2); g2.connect(this.engFilt);
    this.o2.start();

    this.o3 = this.ctx.createOscillator();
    this.o3.type = 'sine';
    this.o3.frequency.value = 84;
    const g3 = this.ctx.createGain(); g3.gain.value = 0.28;
    this.o3.connect(g3); g3.connect(this.engFilt);
    this.o3.start();

    this.musicGain = this.ctx.createGain();
    this.musicGain.gain.value = 0;
    this.musicGain.connect(this.master);

    this.ready = true;
  },

  resume(){ if(this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },

  setEngine(speed, running){
    if(!this.ready) return;
    const t = this.ctx.currentTime;
    const f = 40 + speed * 0.72;
    this.o1.frequency.setTargetAtTime(f, t, 0.14);
    this.o2.frequency.setTargetAtTime(f * 1.5, t, 0.14);
    this.o3.frequency.setTargetAtTime(f * 2.0 + 6, t, 0.14);
    this.engFilt.frequency.setTargetAtTime(260 + speed * 4.2, t, 0.18);
    const vol = running ? 0.05 + (speed / MAX_SPEED) * 0.09 : 0;
    this.engGain.gain.setTargetAtTime(vol, t, 0.22);
  },

  // sfx
  _tone(freq, dur, type, vol, slideTo){
    if(!this.ready) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t+dur);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t+dur+0.05);
  },

  crash(){
    if(!this.ready) return;
    const t = this.ctx.currentTime;
    const dur = 0.7;
    const n = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/n, 1.7);
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const f = this.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value = 1400;
    const g = this.ctx.createGain(); g.gain.value = 0.55;
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t);
    this._tone(140, 0.55, 'sine', 0.4, 32);
  },

  bump(force){
    if(!this.ready) return;
    this._tone(180 + force*40, 0.22, 'sine', 0.08 + force*0.18, 90);
  },

  brake(){
    if(!this.ready) return;
    this._tone(620, 0.16, 'sine', 0.05, 380);
  },

  ding(){
    if(!this.ready) return;
    const t = this.ctx.currentTime;
    [660, 880, 1320].forEach((f,i)=>{
      const o = this.ctx.createOscillator();
      o.type = 'sine'; o.frequency.value = f;
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(0.0001, t+i*0.1);
      g.gain.exponentialRampToValueAtTime(0.16, t+i*0.1+0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t+i*0.1+0.6);
      o.connect(g); g.connect(this.master);
      o.start(t+i*0.1); o.stop(t+i*0.1+0.65);
    });
  },

  // ─── հանգիստ էմբիենթ երաժշտություն ───
  _note(freq, at, dur, type, vol, cutoff){
    const o = this.ctx.createOscillator();
    o.type = type; o.frequency.value = freq;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(vol, at+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, at+dur);
    const f = this.ctx.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = cutoff;
    o.connect(f); f.connect(g); g.connect(this.musicGain);
    o.start(at); o.stop(at+dur+0.08);
  },

  startMusic(){
    if(!this.ready || this.musicTimer) return;
    this.musicGain.gain.setTargetAtTime(0.42, this.ctx.currentTime, 1.4);
    // հանգիստ pad-եր + soft arpeggio
    const CHORDS = [
      [220.00, 261.63, 329.63],   // Am
      [174.61, 220.00, 261.63],   // F
      [196.00, 246.94, 293.66],   // G
      [261.63, 329.63, 392.00]    // C
    ];
    const ARP = [523.25,659.25,783.99,659.25,523.25,440.00,392.00,440.00,
                 440.00,523.25,659.25,523.25,440.00,392.00,349.23,392.00];
    let next = this.ctx.currentTime + 0.1;
    this.step = 0;
    this.musicTimer = setInterval(()=>{
      if(!this.ready) return;
      while(next < this.ctx.currentTime + 0.4){
        const s = this.step % 16;
        // pad 4 հատվածով մեկ
        if(s === 0){
          const ch = CHORDS[Math.floor(this.step/16) % 4];
          ch.forEach((f,i)=> this._note(f, next, 2.4, 'sine', 0.035 - i*0.005, 1200));
        }
        // arpeggio
        this._note(ARP[s], next, 0.9, 'triangle', 0.028, 2800);
        next += 0.32;
        this.step++;
      }
    }, 90);
  },

  stopMusic(){
    if(this.musicTimer){ clearInterval(this.musicTimer); this.musicTimer = null; }
    if(this.ready) this.musicGain.gain.setTargetAtTime(0, this.ctx.currentTime, 0.5);
  }
};

function roadCenterX(z){
  return 24*Math.sin(z*0.0048)
       + 10*Math.sin(z*0.0131)
       + 3.5*Math.sin(z*0.029);
}
function roadSlope(z){
  const d = 0.6;
  return (roadCenterX(z+d) - roadCenterX(z-d)) / (2*d);
}
function roadHeading(z){ return Math.atan(roadSlope(z)); }

/* ─── ճանապարհի տեքստուրա ─── */
function makeRoadTex(){
  const cv = document.createElement('canvas');
  cv.width = 256; cv.height = 512;
  const x = cv.getContext('2d');
  x.fillStyle = '#25282f'; x.fillRect(0,0,256,512);
  for(let i=0;i<6000;i++){
    const px = Math.random()*256, py = Math.random()*512;
    x.fillStyle = Math.random() > 0.5
      ? 'rgba(255,255,255,0.016)'
      : 'rgba(0,0,0,0.05)';
    x.fillRect(px, py, 1.5, 1.5);
  }
  // եզրագիծ
  x.fillStyle = '#e8e8e8';
  x.fillRect(5,0,4,512); x.fillRect(247,0,4,512);
  // կենտրոնական դեղին կրկնակի
  x.fillStyle = '#e0bd44';
  x.fillRect(118,0,5,512); x.fillRect(133,0,5,512);
  // գծանշում ±4
  x.fillStyle = '#d2d2d2';
  for(let y=0;y<512;y+=256){
    x.fillRect(64, y, 4, 128);
    x.fillRect(188, y, 4, 128);
  }
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.encoding = THREE.sRGBEncoding;
  t.anisotropy = 4;
  return t;
}

const WALL_H = 1.2;

function updateRoad(pz){
  const startZ = pz - 120;
  for(let i=0;i<=NUM_SEG;i++){
    const z = startZ + i*SEG_LEN;
    const cx = roadCenterX(z);
    const o = i*6;
    roadPos[o]   = cx - ROAD_HALF;
    roadPos[o+1] = 0;
    roadPos[o+2] = z;
    roadPos[o+3] = cx + ROAD_HALF;
    roadPos[o+4] = 0;
    roadPos[o+5] = z;
    const u = i*4;
    roadUV[u]=0; roadUV[u+1]=z/20;
    roadUV[u+2]=1; roadUV[u+3]=z/20;

    const w = i*12;
    // ձախ պատ
    wallStripPos[w]   = cx - ROAD_HALF; wallStripPos[w+1] = WALL_H; wallStripPos[w+2] = z;
    wallStripPos[w+3] = cx - ROAD_HALF; wallStripPos[w+4] = 0;     wallStripPos[w+5] = z;
    // աջ պատ
    wallStripPos[w+6]  = cx + ROAD_HALF; wallStripPos[w+7]  = WALL_H; wallStripPos[w+8]  = z;
    wallStripPos[w+9]  = cx + ROAD_HALF; wallStripPos[w+10] = 0;      wallStripPos[w+11] = z;
  }
  roadGeo.attributes.position.needsUpdate = true;
  roadGeo.attributes.uv.needsUpdate = true;
  roadGeo.computeBoundingSphere();

  wallStripGeo.attributes.position.needsUpdate = true;
  wallStripGeo.computeBoundingSphere();
}

}

function buildCar(color, isPlayer){
  const g = new THREE.Group();

  // ─── մարմնի գույներ ───
  const bodyMat = new THREE.MeshStandardMaterial({
    color, metalness:0.85, roughness:0.24,
    emissive: isPlayer ? 0x220000 : 0x000000,
    emissiveIntensity: isPlayer ? 0.35 : 0
  });
  const trimMat = new THREE.MeshStandardMaterial({ color:0x0a0d16, metalness:0.7, roughness:0.35 });
  const chromeMat = new THREE.MeshStandardMaterial({ color:0xcdd6e0, metalness:0.98, roughness:0.14 });
  const glassMat = new THREE.MeshStandardMaterial({
    color:0x050a18, metalness:0.75, roughness:0.06,
    transparent:true, opacity:0.94
  });
  const blackMat = new THREE.MeshStandardMaterial({ color:0x080a11, roughness:0.9 });

  // ─── ստորին հատակ (chassis) ───
  const chassis = new THREE.Mesh(new THREE.BoxGeometry(1.98, 0.16, 4.4), blackMat);
  chassis.position.y = 0.4; g.add(chassis);

  // ─── հիմնական մարմին (ներքևի) ───
  const lower = new THREE.Mesh(new THREE.BoxGeometry(1.94, 0.42, 4.3), bodyMat);
  lower.position.y = 0.62; g.add(lower);

  // ─── մարմնի կենտրոնական մաս (ավելի նեղ) ───
  const mid = new THREE.Mesh(new THREE.BoxGeometry(1.86, 0.22, 4.2), bodyMat);
  mid.position.y = 0.94; g.add(mid);

  // ─── քիթ (նեղացված) ───
  const nose = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.34, 1.1), bodyMat);
  nose.position.set(0, 0.62, 2.36); g.add(nose);

  // ─── առջևի բամպեր ───
  const frontBumper = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.26, 0.35), trimMat);
  frontBumper.position.set(0, 0.48, 2.8); g.add(frontBumper);

  // ─── հետևի բամպեր ───
  const rearBumper = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.26, 0.35), trimMat);
  rearBumper.position.set(0, 0.48, -2.22); g.add(rearBumper);

  // ─── կաբինա (սրահ) ───
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.72, 0.56, 2.2), glassMat);
  cabin.position.set(0, 1.18, -0.32); g.add(cabin);

  // ─── տանիք (վերին) ───
  const roof = new THREE.Mesh(new THREE.BoxGeometry(1.66, 0.06, 1.9), bodyMat);
  roof.position.set(0, 1.46, -0.32); g.add(roof);

  // ─── A/B/C pillar-ներ (մուգ շերտեր) ───
  const pillarMat = new THREE.MeshStandardMaterial({ color:0x080c14, roughness:0.55 });
  [-0.85, 0.85].forEach(px=>{
    const pA = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.6, 0.14), pillarMat);
    pA.position.set(px, 1.2, 0.72); g.add(pA);
    const pB = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.6, 0.14), pillarMat);
    pB.position.set(px, 1.2, -0.3); g.add(pB);
    const pC = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.6, 0.14), pillarMat);
    pC.position.set(px, 1.2, -1.36); g.add(pC);
  });

  // ─── հետևի թև (spoiler) ───
  const spoiler = new THREE.Mesh(new THREE.BoxGeometry(1.74, 0.09, 0.5), trimMat);
  spoiler.position.set(0, 1.12, -2.02); g.add(spoiler);
  const spLegL = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.25, 0.16), trimMat);
  spLegL.position.set(-0.7, 0.97, -2.02); g.add(spLegL);
  const spLegR = spLegL.clone(); spLegR.position.x = 0.7; g.add(spLegR);

  // ─── անիվներ ───
  const wheelGeo = new THREE.CylinderGeometry(0.44, 0.44, 0.36, 18);
  const rimGeo = new THREE.CylinderGeometry(0.26, 0.26, 0.38, 10);
  const wheelMat = new THREE.MeshStandardMaterial({ color:0x0e1014, roughness:0.92 });
  const wheels = [];
  [[-0.99, 1.42, 'fl'], [0.99, 1.42, 'fr'], [-0.99, -1.42, 'rl'], [0.99, -1.42, 'rr']].forEach(([px,pz,tag])=>{
    const w = new THREE.Mesh(wheelGeo, wheelMat);
    w.rotation.z = Math.PI/2;
    w.position.set(px, 0.44, pz);
    const rim = new THREE.Mesh(rimGeo, chromeMat);
    rim.rotation.z = Math.PI/2; w.add(rim);
    // արգելակային սկավառակ (փոքր կարմիր)
    g.add(w); wheels.push({ mesh:w, tag });
  });

  // ─── հետևի լույսեր ───
  const tailMat = new THREE.MeshBasicMaterial({ color:0xff2a2a });
  const tailL = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.16, 0.1), tailMat);
  tailL.position.set(-0.62, 0.78, -2.24); g.add(tailL);
  const tailR = tailL.clone(); tailR.position.x = 0.62; g.add(tailR);

  // ─── հետևի արգելակային մշուշ ───
  const brakeGlow = new THREE.Mesh(
    new THREE.PlaneGeometry(2.1, 0.6),
    new THREE.MeshBasicMaterial({color:0xff2a2a, transparent:true, opacity:0.0, depthWrite:false})
  );
  brakeGlow.position.set(0, 0.78, -2.30);
  brakeGlow.rotation.x = Math.PI; // ուղղված դեպի հետև
  g.add(brakeGlow);

  // ─── առջևի լուսարձակներ ───
  const headMat = new THREE.MeshBasicMaterial({ color:0xfff2d0 });
  const headL = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.18, 0.1), headMat);
  headL.position.set(-0.62, 0.66, 2.82); g.add(headL);
  const headR = headL.clone(); headR.position.x = 0.62; g.add(headR);

  // ─── իրական լուսարձակի լույսեր (միայն խաղացողի) ───
  if(isPlayer){
    const sp = new THREE.SpotLight(0xfff0c0, 1.6, 45, Math.PI/5.5, 0.55, 1.2);
    sp.position.set(-0.62, 0.66, 2.82);
    sp.target.position.set(-1.2, 0, 18);
    g.add(sp); g.add(sp.target);

    const sp2 = new THREE.SpotLight(0xfff0c0, 1.6, 45, Math.PI/5.5, 0.55, 1.2);
    sp2.position.set(0.62, 0.66, 2.82);
    sp2.target.position.set(1.2, 0, 18);
    g.add(sp2); g.add(sp2.target);
  }

  // ─── առջևի ձայնաթիռ (փափուկ լուսավոր հետք) ───
  const beam = new THREE.Mesh(
    new THREE.PlaneGeometry(3.6, 18),
    new THREE.MeshBasicMaterial({
      color:0xfff0c0, transparent:true,
      opacity: isPlayer ? 0.13 : 0.06,
      depthWrite:false, side:THREE.DoubleSide
    })
  );
  beam.rotation.x = -Math.PI/2;
  beam.position.set(0, 0.06, 10);
  g.add(beam);

  // ─── անիվների լուսավորված շրջանակ (նեոն) ───
  if(isPlayer){
    const neon = new THREE.PointLight(0x5eb0ff, 1.2, 8, 2);
    neon.position.set(0, 0.2, 0);
    g.add(neon);
  }

  return { group:g, wheels, brakeGlow, tailMat, bodyMat };
}

function makeBuildingTex(){
  const cv = document.createElement('canvas');
  cv.width = 128; cv.height = 256;
  const x = cv.getContext('2d');
  x.fillStyle = '#0a0f1c'; x.fillRect(0,0,128,256);
  const cols = 6, rows = 14;
  const cw = 128/cols, ch = 256/rows;
  for(let r=2;r<rows-1;r++){
    for(let c=1;c<cols-1;c++){
      const rnd = Math.random();
      if(rnd > 0.38){
        const bright = 0.35 + Math.random()*0.65;
        const hue = Math.random();
        x.globalAlpha = bright;
        x.fillStyle = hue > 0.78 ? '#ffdf9c'
                    : hue > 0.55 ? '#9dd9ff'
                    : hue > 0.3  ? '#ffb777'
                    : '#e8f0ff';
        x.fillRect(c*cw + 2, r*ch + 2, cw - 4, ch - 4);
      }
    }
  }
  x.globalAlpha = 1;
  // պատուհանների հատիկավոր պատյան
  for(let i=0;i<400;i++){
    x.fillStyle = 'rgba(0,0,0,' + (0.03 + Math.random()*0.05) + ')';
    x.fillRect(Math.random()*128, Math.random()*256, 2, 2);
  }
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.encoding = THREE.sRGBEncoding;
  return t;
}

function updateScenery(pz){
  buildings.forEach((b)=>{
    while(b.userData.z < pz - 150) b.userData.z += 2600;

    b.position.set(
      roadCenterX(z) + side * (b.userData.offset + b.userData.w/2),
      b.userData.h/2,
      z
    );
    b.rotation.y = Math.atan(roadSlope(z));
  });
  lamps.forEach((l)=>{
    while(l.userData.z < pz - 120) l.userData.z += 2600;
    const z = l.userData.z;
    const side = l.userData.side;
    l.position.set(roadCenterX(z) + side * (ROAD_HALF + 3.4), 0, z);
    l.rotation.y = side > 0 ? 0 : Math.PI;

function spawnTraffic(){
  const lvl = LEVELS[S.level-1];
  const free = TRAFFIC_POOL.find(c => !c.group.visible);
  if(!free) return;

  const lane = Math.floor(Math.random()*4);
  const oncoming = lane < 2;
  const z = S.z + 340 + Math.random()*300;

  // ստուգում. ±130մ-ում ամենաշատը 2
  let near = 0;
  for(const t of traffic) if(Math.abs(t.z - z) < 130) near++;
  if(near >= 2) return;

  // նույն գիծ
  for(const t of traffic){
    if(t.lane === lane && Math.abs(t.z - z) < 80) return;
  }

  const spd = oncoming
    ? 15 + Math.random()*8
    : 10 + Math.random()*6;

  free.group.visible = true;
  free.group.position.set(0,0,z);
  traffic.push({
    obj: free, lane, off: LANE_OFF[lane], z,
    dir: oncoming ? -1 : 1,
    spd, oncoming
  });
}

function updateTraffic(dt){
  for(let i=traffic.length-1;i>=0;i--){
    const t = traffic[i];
    t.z += t.dir * t.spd * dt;
    const cx = roadCenterX(t.z) + t.off;
    t.obj.group.position.set(cx, 0, t.z);
    let h = Math.atan(roadSlope(t.z));
    if(t.dir < 0) h += Math.PI;
    t.obj.group.rotation.y = h;
    t.obj.wheels.forEach(w => w.mesh.rotation.x -= t.spd * dt * 1.7);

    if(t.z < S.z - 80 || t.z > S.z + 1400){
      t.obj.group.visible = false;
      traffic.splice(i,1);
    }
  }
}

function clearTraffic(){
  traffic.forEach(t => t.obj.group.visible = false);
  traffic.length = 0;
}

/* ─────────────────────────────────────────────
   9. ԲԱԽՈՒՄ
───────────────────────────────────────────── */
function checkCollisions(){
  if(S.hitCd > 0) return;
  for(let i=traffic.length-1;i>=0;i--){
    const t = traffic[i];
    const cx = t.obj.group.position.x;
    const cz = t.obj.group.position.z;
    if(Math.abs(S.x - cx) < 1.9 && Math.abs(S.z - cz) < 3.9){
      handleHit(t, i);
      return;
    }
  }
}

function handleHit(t, idx){
  S.hitCd = 0.75;
  const sp = S.speed;

  if(sp >= 150){
    Audio_.crash();
    doCrash('ՎԹԱՐ', 'Արագությունը չափազանց բարձր էր');
    return;
  }

  let dmg;
  if(sp >= 110) dmg = 48;
  else if(sp >= 80) dmg = 32;
  else if(sp >= 50) dmg = 16;
  else if(sp >= 25) dmg = 7;
  else dmg = 2;

  S.health -= dmg;
  S.speed *= (sp >= 80 ? 0.42 : 0.7);
  S.shake = Math.min(1.5, 0.35 + sp/180);
  flashDamage();
  Audio_.bump(Math.min(1, sp/150));

  t.obj.group.visible = false;
  traffic.splice(idx,1);

  if(S.health <= 0){
    Audio_.crash();
    doCrash('ՎԹԱՐ', 'Մեքենան ամբողջովին վնասվեց');
  }
}

function flashDamage(){
  const el = document.getElementById('flash');
  el.style.transition = 'none';
  el.style.opacity = '1';
  requestAnimationFrame(()=>{
    el.style.transition = 'opacity .5s';
    el.style.opacity = '0';
  });
}

function startLevel(n){
  const lvl = LEVELS[n-1];
  S.level = n;
  S.levelLen = lvl.len;
  S.speed = 0;
  S.z = 0;
  S.x = roadCenterX(0) + LANE_OFF[2];
  S.heading = roadHeading(0);
  S.steer = 0; S.steerTarget = 0;
  S.health = 100;
  S.hitCd = 0;
  S.shake = 0;
  S.time = 0;
  S.countdown = 3.4;
  S._lastC = undefined;
  S.phase = 'countdown';

  // կամերա վերականգնում
  S.camX = S.x - Math.sin(S.heading)*S.camDist;
  S.camY = S.camHeight;
  S.camZ = S.z - Math.cos(S.heading)*S.camDist;
  S.camLookX = S.x; S.camLookY = 1.5; S.camLookZ = S.z + 8;

  clearTraffic();

  player.group.position.set(S.x, 0, S.z);
  player.group.rotation.y = S.heading;

  finishGroup.visible = true;
  finishGroup.position.set(roadCenterX(lvl.len), 0, lvl.len);
  finishGroup.rotation.y = roadHeading(lvl.len);

  const zStart = lvl.len - 125;
  zoneMesh.visible = true;
  zoneMesh.position.set(roadCenterX(zStart), 0.02, zStart);
  zoneMesh.rotation.z = -roadHeading(zStart);

  document.getElementById('lvlName').textContent = 'ՄԱԿԱՐԴԱԿ ' + n + ' · ' + lvl.name;
  document.getElementById('hpBar').style.width = '100%';
  document.getElementById('hpBar').style.background = 'linear-gradient(90deg,#3ddc84,#a8ff60)';
  updateHUD();

  document.getElementById('endScreen').classList.remove('show');
  document.getElementById('menu').classList.add('hide');
  document.getElementById('btnRetry').onclick = retryHandler;

  Audio_.init(); Audio_.resume(); Audio_.startMusic();
  showMsg('3', 'gold');
}

function doCrash(title, sub){
  if(S.phase === 'crash') return;
  S.phase = 'crash';
  S.speed = 0;
  S.shake = 1.9;
  showMsg(title, 'red');
  setTimeout(()=>{
    document.getElementById('endTitle').textContent = title;
    document.getElementById('endTitle').style.color = '#ff5a5a';
    document.getElementById('endSub').textContent = sub + ' — կրկնի՛ր մակարդակը';
    document.getElementById('btnRetry').textContent = 'ԿՐԿՆԵԼ';
    document.getElementById('endScreen').classList.add('show');
    Audio_.stopMusic();
  }, 1200);
}

function doWin(){
  if(S.phase === 'win') return;
  S.phase = 'win';
  S.speed = 0;
  Audio_.ding();
  showMsg('ՀԱՂԹԱՆԱԿ', 'green');

  const key = 'lv'+S.level;
  if(!S.best[key] || S.best[key] > S.time) S.best[key] = S.time;
  S.best['unlocked'] = Math.max(S.best['unlocked']||1, Math.min(5, S.level+1));
  localStorage.setItem('gisher_best', JSON.stringify(S.best));

  setTimeout(()=>{
    document.getElementById('endTitle').textContent = 'ՀԱՂԹԱՆԱԿ';
    document.getElementById('endTitle').style.color = '#8affc0';
    document.getElementById('endSub').textContent =
      'Մակարդակ ' + S.level + ' · Ժամանակ՝ ' + S.time.toFixed(1) + ' վրկ';
    document.getElementById('btnRetry').textContent = S.level < 5 ? 'ՀԱՋՈՐԴԸ ▶' : 'ԿՐԿՆԵԼ';
    document.getElementById('endScreen').classList.add('show');
    Audio_.stopMusic();
  }, 1300);
}

/* ─────────────────────────────────────────────
   11. ՖԻԶԻԿԱ — ճարպիկ, արագ արձագանքող
───────────────────────────────────────────── */
function updatePhysics(dt){
  const lvl = LEVELS[S.level-1];

  // ─── ԱՐԱԳՈՒԹՅՈՒՆ ───
  if(input.gas){
    const a = S.speed < 60 ? 62 : (S.speed < 130 ? 44 : 26);
    S.speed += a * dt;
  }
  if(input.brake){
    S.speed -= 105 * dt;
    if(S.speed > 30 && Math.random() < 0.04) Audio_.brake();
  }
  if(!input.gas && !input.brake){
    S.speed -= 14 * dt;
  }
  if(S.speed < 0) S.speed = 0;
  if(S.speed > MAX_SPEED) S.speed = MAX_SPEED;

  // ─── ՂԵԿ (արագ արձագանք) ───
  let target = 0;
  if(input.left)  target = -1;
  if(input.right) target = 1;

  // արագ մոտեցում (այլևս դանդաղ չի)
  const steerSpeed = 8.5;
  S.steer += (target - S.steer) * Math.min(1, steerSpeed * dt);

  // արագ վերադարձ կենտրոն
  if(!input.left && !input.right){
    S.steer += (0 - S.steer) * Math.min(1, 10 * dt);
    if(Math.abs(S.steer) < 0.005) S.steer = 0;
  }

  // ─── պտույտ ───
  const spFactor = Math.min(1, S.speed / 32);
  const damp = 1 - 0.28 * Math.min(1, S.speed / MAX_SPEED);
  const turnRate = 2.4 * spFactor * damp;
  // ՈՒՂՂՈՒՄ: աջ = heading նվազում (աջ դառնալու համար)
  S.heading -= S.steer * turnRate * dt;

  // ─── դիրք ───
  const v = S.speed / 3.6;
  S.x += Math.sin(S.heading) * v * dt;
  S.z += Math.cos(S.heading) * v * dt;

  // ─── պատնեշներին սահմանափակում ───
  const cX = roadCenterX(S.z);
  const off = S.x - cX;
  const lim = ROAD_HALF - 1.05;
  if(off > lim){
    S.x = cX + lim;
    if(S.speed > 40) S.speed -= 25 * dt;
    S.shake = Math.max(S.shake, 0.08);
  } else if(off < -lim){
    S.x = cX - lim;
    if(S.speed > 40) S.speed -= 25 * dt;
    S.shake = Math.max(S.shake, 0.08);
  }

  S.hitCd -= dt;

  // ─── մեքենայի տեսք ───
  player.group.position.set(S.x, 0, S.z);
  player.group.rotation.y = S.heading;

  const spin = (S.speed/3.6) * dt * 1.7;
  player.wheels.forEach(w=>{
    w.mesh.rotation.x -= spin;
    if(w.tag === 'fl' || w.tag === 'fr') w.mesh.rotation.y = S.steer * 0.55;
  });

  // արգելակային լուսարձակ
  const braking = input.brake || (!input.gas && S.speed > 5);
  player.brakeGlow.material.opacity = braking ? 0.65 : 0;
  player.tailMat.color.setHex(braking ? 0xff1010 : 0xff2a2a);

  // ─── կանգառի գոտի ───
  const zoneStart = S.levelLen - 250;
  if(S.z >= zoneStart && S.z < S.levelLen + 30){
    if(S.speed < 7 && S.phase === 'play'){
      doWin();
    }
  }
  if(S.z > S.levelLen + 40 && S.phase === 'play'){
    Audio_.crash();
    doCrash('ԲԱԽՈՒՄ', 'Անցար վերջնագիծը առանց կանգնելու');
  }
}

/* ─────────────────────────────────────────────
   12. ԿԱՄԵՐԱ — սահուն, մոտիկ, պրոֆեսիոնալ
───────────────────────────────────────────── */
function updateCamera(dt){
  const h = S.heading;
  const fwdX = Math.sin(h), fwdZ = Math.cos(h);

  // կամերայի ցանկալի դիրք
  const baseDist = 9.2;
  const baseHigh = 3.6;

  // camPitch-ը փոխում է բարձրությունը/հեռավորությունը
  const pitchFactor = S.camPitch; // -0.4..0.35
  const dist = baseDist - pitchFactor * 3.5;
  const high = baseHigh + pitchFactor * 4.5;

  const tx = S.x - fwdX * dist;
  const ty = high;
  const tz = S.z - fwdZ * dist;

  // smooth damping (framerate-independent)
  const k = 1 - Math.pow(0.0009, dt);
  S.camX += (tx - S.camX) * k;
  S.camY += (ty - S.camY) * k;
  S.camZ += (tz - S.camZ) * k;

  // look-at target
  const lookFwd = 10;
  const lx = S.x + fwdX * lookFwd + S.steer * 1.8;
  const ly = 1.6;
  const lz = S.z + fwdZ * lookFwd;
  const lk = 1 - Math.pow(0.0008, dt);
  S.camLookX += (lx - S.camLookX) * lk;
  S.camLookY += (ly - S.camLookY) * lk;
  S.camLookZ += (lz - S.camLookZ) * lk;

  // shake
  let sx=0, sy=0;
  if(S.shake > 0.005){
    sx = (Math.random()-0.5) * S.shake * 1.1;
    sy = (Math.random()-0.5) * S.shake * 0.8;
    S.shake *= Math.pow(0.05, dt);
    if(S.shake < 0.005) S.shake = 0;
  }

  camera.position.set(S.camX + sx, S.camY + sy, S.camZ);
  camera.lookAt(S.camLookX, S.camLookY, S.camLookZ);

  // FOV speed effect
  const targetFov = 68 + (S.speed / MAX_SPEED) * 18;
  camera.fov += (targetFov - camera.fov) * Math.min(1, 4*dt);
  camera.updateProjectionMatrix();

  // թեթև roll ղեկի ժամանակ
  camera.rotation.z += S.steer * 0.028;
}

/* ─────────────────────────────────────────────
   13. HUD + ՄԻՆԻ ՔԱՐՏԵԶ + ՍԼԱՔ
───────────────────────────────────────────── */
const mapCv = document.getElementById('mapCanvas');
const mapCtx = mapCv.getContext('2d');

function drawMinimap(){
  const w = mapCv.width, h = mapCv.height;
  mapCtx.clearRect(0,0,w,h);

  // ֆոն
  mapCtx.fillStyle = 'rgba(6,10,22,0.55)';
  mapCtx.fillRect(0,0,w,h);

  const range = 320; // մետր՝ էկրանի վրա
  const cx = w/2, cy = h/2;
  const scale = w / range;

  // ճանապարհը (որպես պոլիլին)
  mapCtx.strokeStyle = 'rgba(120,180,255,0.55)';
  mapCtx.lineWidth = 14 * scale * 2;
  mapCtx.lineCap = 'round';
  mapCtx.beginPath();
  const step = 8;
  for(let z = S.z - range/2; z <= S.z + range/2; z += step){
    const rx = roadCenterX(z);
    const mx = cx + (rx - S.x) * scale;
    const my = cy - (z - S.z) * scale;
    if(z === S.z - range/2) mapCtx.moveTo(mx, my);
    else mapCtx.lineTo(mx, my);
  }
  mapCtx.stroke();

  // կենտրոնական գիծ
  mapCtx.strokeStyle = 'rgba(230,190,70,0.55)';
  mapCtx.lineWidth = 1.5;
  mapCtx.beginPath();
  for(let z = S.z - range/2; z <= S.z + range/2; z += step){
    const rx = roadCenterX(z);
    const mx = cx + (rx - S.x) * scale;
    const my = cy - (z - S.z) * scale;
    if(z === S.z - range/2) mapCtx.moveTo(mx, my);
    else mapCtx.lineTo(mx, my);
  }
  mapCtx.stroke();

  // թրաֆիկ
  mapCtx.fillStyle = '#ff5a5a';
  traffic.forEach(t=>{
    const tx = cx + (t.obj.group.position.x - S.x) * scale;
    const ty = cy - (t.obj.group.position.z - S.z) * scale;
    if(tx < -10 || tx > w+10 || ty < -10 || ty > h+10) return;
    mapCtx.beginPath();
    mapCtx.arc(tx, ty, 4, 0, Math.PI*2);
    mapCtx.fill();
  });

  // նպատակակետ
  const finishZ = S.levelLen;
  const fx = cx + (roadCenterX(finishZ) - S.x) * scale;
  const fy = cy - (finishZ - S.z) * scale;
  if(fy > -20 && fy < h+20){
    mapCtx.fillStyle = '#ffd45e';
    mapCtx.beginPath();
    mapCtx.arc(fx, fy, 8, 0, Math.PI*2);
    mapCtx.fill();
    mapCtx.strokeStyle = '#fff';
    mapCtx.lineWidth = 2;
    mapCtx.stroke();
    // զիգզագ դրոշակ
    mapCtx.fillStyle = '#000';
    mapCtx.font = 'bold 12px sans-serif';
    mapCtx.textAlign = 'center';
    mapCtx.textBaseline = 'middle';
    mapCtx.fillText('⚑', fx, fy+1);
  }

  // խաղացողը (եռանկյուն, ուղղված ըստ heading-ի)
  mapCtx.save();
  mapCtx.translate(cx, cy);
  // heading=0 → ներքև (քանի որ my = cy - (z-S.z), +z-ը վերև է)
  mapCtx.rotate(-S.heading);
  mapCtx.fillStyle = '#5eead4';
  mapCtx.beginPath();
  mapCtx.moveTo(0, -10);      // քիթ
  mapCtx.lineTo(-7, 8);
  mapCtx.lineTo(7, 8);
  mapCtx.closePath();
  mapCtx.fill();
  mapCtx.strokeStyle = '#fff';
  mapCtx.lineWidth = 1.5;
  mapCtx.stroke();
  mapCtx.restore();
}

const objArrowEl = document.getElementById('objArrow');
const objLabelEl = document.getElementById('objLabel');

function updateObjective(){
  const dz = S.levelLen - S.z;
  const dx = roadCenterX(S.levelLen) - S.x;
  const dist = Math.sqrt(dx*dx + dz*dz);

  // ուղղության անկյուն (համեմատած մեքենայի heading-ի հետ)
  const worldAngle = Math.atan2(dx, dz);
  const rel = worldAngle - S.heading;

  // CSS rotate
  const deg = -rel * 180 / Math.PI;
  objArrowEl.style.transform = 'translateX(-50%) rotate(' + deg + 'deg)';

  // opacity արագության / մոտիկության հետ
  const near = dist < 200;
  objArrowEl.style.opacity = near ? '0.4' : '0.92';

  const m = Math.max(0, Math.round(dist));
  objLabelEl.textContent = 'ՆՊԱՏԱԿԸ՝ ' + m + ' մ';
}

let lastHudT = 0;
function updateHUD(){
  const sp = Math.round(S.speed);
  const spEl = document.getElementById('spdVal');
  spEl.textContent = sp;
  if(sp >= 150){
    spEl.style.background = 'linear-gradient(90deg,#ff5a5a,#ff2b2b)';
  } else if(sp >= 100){
    spEl.style.background = 'linear-gradient(90deg,#ffd36e,#ff7a45)';
  } else {
    spEl.style.background = 'linear-gradient(90deg,#7ee7ff,#5eb0ff)';
  }
  spEl.style.webkitBackgroundClip = 'text';
  spEl.style.backgroundClip = 'text';

  const rem = Math.max(0, S.levelLen - S.z);
  document.getElementById('distVal').textContent = Math.round(rem) + ' մ';

  const hp = Math.max(0, Math.min(100, S.health));
  const bar = document.getElementById('hpBar');
  bar.style.width = hp + '%';
  bar.style.background = hp > 60
    ? 'linear-gradient(90deg,#3ddc84,#a8ff60)'
    : hp > 30
      ? 'linear-gradient(90deg,#ffd45e,#ff9a45)'
      : 'linear-gradient(90deg,#ff4d4d,#ff2020)';

  // ղեկ
  document.getElementById('wheelInner').style.transform =
    'rotate(' + (S.steer * 145) + 'deg)';

  // speed fx
  document.getElementById('speedFx').style.opacity =
    Math.max(0, (S.speed - 100) / 100);
}

let msgTimer = null;
function showMsg(text, cls){
  const m = document.getElementById('msg');
  m.textContent = text;
  m.className = cls || '';
  m.classList.remove('show');
  void m.offsetWidth;
  m.classList.add('show');
}

/* ─────────────────────────────────────────────
   14. ՀԱՂՈՐԴԱԿՑՈՒԹՅՈՒՆ
───────────────────────────────────────────── */
function bindHold(el, key){
  const on = e => {
    e.preventDefault();
    input[key] = true;
    el.classList.add('on');
    Audio_.init(); Audio_.resume();
  };
  const off = e => {
    e.preventDefault();
    input[key] = false;
    el.classList.remove('on');
  };
  el.addEventListener('touchstart', on, {passive:false});
  el.addEventListener('touchend', off);
  el.addEventListener('touchcancel', off);
  el.addEventListener('mousedown', on);
  el.addEventListener('mouseup', off);
  el.addEventListener('mouseleave', off);
}

bindHold(document.getElementById('btnGas'), 'gas');
bindHold(document.getElementById('btnBrake'), 'brake');
bindHold(document.getElementById('btnL'), 'left');
bindHold(document.getElementById('btnR'), 'right');

// Ստեղնաշար
addEventListener('keydown', e=>{
  if(e.repeat) return;
  const k = e.key.toLowerCase();
  if(k === 'arrowup' || k === 'w')    input.gas = true;
  if(k === 'arrowdown' || k === 's')  input.brake = true;
  if(k === 'arrowleft' || k === 'a')  input.left = true;
  if(k === 'arrowright' || k === 'd') input.right = true;
  Audio_.init(); Audio_.resume();
});
addEventListener('keyup', e=>{
  const k = e.key.toLowerCase();
  if(k === 'arrowup' || k === 'w')    input.gas = false;
  if(k === 'arrowdown' || k === 's')  input.brake = false;
  if(k === 'arrowleft' || k === 'a')  input.left = false;
  if(k === 'arrowright' || k === 'd') input.right = false;
});

// ─── Աջ եզրից կամերայի կառավարում ───
(function camControl(){
  const zone = document.getElementById('camZone');
  const hint = document.getElementById('camHint');
  let dragging = false;
  let startY = 0;
  let startPitch = 0;

  const onDown = e => {
    e.preventDefault();
    dragging = true;
    const t = e.touches ? e.touches[0] : e;
    startY = t.clientY;
    startPitch = S.camPitch;
    hint.style.opacity = '0';
  };
  const onMove = e => {
    if(!dragging) return;
    e.preventDefault();
    const t = e.touches ? e.touches[0] : e;
    const dy = t.clientY - startY;
    // վերև քաշել → բարձր, ներքև → ցածր (կամերան)
    // միավոր. 250px = 0.75 pitch
    const np = startPitch - dy / 340;
    S.camPitch = Math.max(-0.35, Math.min(0.65, np));
  };
  const onUp = e => {
    dragging = false;
    setTimeout(()=>{ hint.style.opacity = '1'; }, 1800);
  };

  zone.addEventListener('touchstart', onDown, {passive:false});
  zone.addEventListener('touchmove', onMove, {passive:false});
  zone.addEventListener('touchend', onUp);
  zone.addEventListener('touchcancel', onUp);

  zone.addEventListener('mousedown', onDown);
  addEventListener('mousemove', onMove);
  addEventListener('mouseup', onUp);

  // անիվով նույնպես
  zone.addEventListener('wheel', e=>{
    e.preventDefault();
    S.camPitch = Math.max(-0.35, Math.min(0.65, S.camPitch + e.deltaY * 0.0012));
  }, {passive:false});
})();

/* ─────────────────────────────────────────────
   15. ՄԵՆՅՈՒ
───────────────────────────────────────────── */
function buildMenu(){
  const wrap = document.getElementById('levels');
  wrap.innerHTML = '';
  const unlocked = S.best['unlocked'] || 1;
  for(let i=1;i<=5;i++){
    const d = document.createElement('div');
    d.className = 'lvlBtn';
    if(i > unlocked) d.classList.add('locked');
    if(S.best['lv'+i]) d.classList.add('done');
    d.innerHTML =
      '<div class="n">' + (S.best['lv'+i] ? '★' : i) + '</div>' +
      '<div class="t">' + LEVELS[i-1].name + '</div>';
    d.onclick = ()=>{
      if(i > unlocked) return;
      enterFullscreen();
      Audio_.init(); Audio_.resume();
      startLevel(i);
    };
    wrap.appendChild(d);
  }
}

/* ─── FULLSCREEN ─── */
function enterFullscreen(){
  const el = document.documentElement;
  try{
    if(el.requestFullscreen)      el.requestFullscreen({navigationUI:'hide'});
    else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    else if(el.msRequestFullscreen) el.msRequestFullscreen();
  }catch(e){}
  // orientation lock
  setTimeout(()=>{
    if(screen.orientation && screen.orientation.lock){
      screen.orientation.lock('landscape').catch(()=>{});
    }
  }, 220);
}

document.getElementById('startBtn').onclick = ()=>{
  enterFullscreen();
  Audio_.init(); Audio_.resume();
  const unlocked = S.best['unlocked'] || 1;
  startLevel(Math.min(unlocked, 5));
};

function retryHandler(){
  Audio_.resume();
  if(S.phase === 'win' && S.level < 5){
    startLevel(S.level + 1);
  } else {
    startLevel(S.level);
  }
}
document.getElementById('btnRetry').onclick = retryHandler;

document.getElementById('btnMenu').onclick = ()=>{
  S.phase = 'menu';
  clearTraffic();
  document.getElementById('endScreen').classList.remove('show');
  document.getElementById('menu').classList.remove('hide');
  Audio_.stopMusic();
  buildMenu();
};

document.getElementById('pauseBtn').onclick = ()=>{
  if(S.phase === 'play' || S.phase === 'countdown'){
    S.phase = 'paused';
    document.getElementById('endTitle').textContent = 'ԿԱՆԳ';
    document.getElementById('endTitle').style.color = '#9fc6ff';
    document.getElementById('endSub').textContent = 'Խաղը դադարեցված է';
    document.getElementById('btnRetry').textContent = 'ՇԱՐՈՒՆԱԿԵԼ';
    document.getElementById('endScreen').classList.add('show');
    Audio_.stopMusic();
    document.getElementById('btnRetry').onclick = ()=>{
      document.getElementById('endScreen').classList.remove('show');
      S.phase = 'countdown';
      S.countdown = 2.2;
      document.getElementById('btnRetry').onclick = retryHandler;
      Audio_.startMusic();
    };
  }
};

/* ─────────────────────────────────────────────
   16. ՉԱՓԵՐ
───────────────────────────────────────────── */
function resize(){
  const w = appEl.clientWidth  || window.innerWidth;
  const h = appEl.clientHeight || window.innerHeight;
  renderer.setSize(w, h, false);
  renderer.domElement.style.width = '100%';
  renderer.domElement.style.height = '100%';
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
addEventListener('orientationchange', ()=>setTimeout(resize, 150));

/* ─────────────────────────────────────────────
   17. ՀԻՄՆԱԿԱՆ ՑԻԿԼ
───────────────────────────────────────────── */
let lastT = performance.now();
let spawnTimer = 0;
let mapTick = 0;

function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;

  if(S.phase === 'countdown'){
    S.countdown -= dt;
    const c = Math.ceil(S.countdown - 0.4);
    if(c !== S._lastC){
      S._lastC = c;
      if(c > 0) showMsg(String(c), 'gold');
      else if(c === 0) showMsg('ԳՆԱ՛', 'green');
    }
    if(S.countdown <= 0){
      S.phase = 'play';
      S.time = 0;
      S._lastC = undefined;
    }
    // թույլ տալ թրաֆիկը շարժվի
    updateTraffic(dt * 0.4);
  } else if(S.phase === 'play'){
    S.time += dt;
    updatePhysics(dt);
    updateTraffic(dt);

    const lvl = LEVELS[S.level-1];
    spawnTimer -= dt;
    if(spawnTimer <= 0){
      spawnTraffic();
      spawnTimer = lvl.spawn * (0.7 + Math.random()*0.6);
    }
    checkCollisions();
  } else {
    updateTraffic(dt * 0.25);
    S.shake *= Math.pow(0.04, dt);
  }

  updateRoad(S.z);
  updateScenery(S.z);
  updateCamera(dt);
  updateHUD();
  updateObjective();

  // minimap-ը 30fps-ով
  mapTick += dt;
  if(mapTick > 0.033){
    mapTick = 0;
    drawMinimap();
  }

  Audio_.setEngine(S.speed, S.phase === 'play' || S.phase === 'countdown');

  if(S.levelLen - S.z < -200){
    finishGroup.visible = false;
    zoneMesh.visible = false;
  }

  renderer.render(scene, camera);
}

['touchstart','mousedown','keydown'].forEach(ev=>{
